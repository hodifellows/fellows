name: Bug
description: Something is broken or looks wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Add a screenshot if it helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can someone see it?
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
